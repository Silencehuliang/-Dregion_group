name: Update subscription

# 订阅以「本地验证后发布」为主(见 本地更新并发布.bat): 在你自己网络里验证节点, 再把结果推到同一个 Cloudflare 地址。
# 这里保留手动触发(workflow_dispatch)作为备用/海外线路; 定时任务已关闭, 以免海外 runner 的验证结果覆盖本地结果。
on:
  # schedule:
  #   - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# 同一时刻只跑一个，避免并发写 KV / 并发提交。
concurrency:
  group: update-sub
  cancel-in-progress: false

permissions:
  contents: write   # 用于把生成的订阅提交回仓库(备份镜像)

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: pip install --quiet pyyaml

      # GeoIP 离线库 ~10MB，缓存起来省去每次都下载。
      - name: Cache GeoIP database
        uses: actions/cache@v4
        with:
          path: cache/geoip_country_ipv4.csv
          key: geoip-db-v1

      # 下载 mihomo 内核(Linux)到 bin/，供 region_group.py 做真连可用性验证。
      - name: Install mihomo core
        run: |
          set -e
          url=$(python -c "import json,urllib.request as u;r=json.load(u.urlopen('https://api.github.com/repos/MetaCubeX/mihomo/releases/latest'));print(next(a['browser_download_url'] for a in r['assets'] if a['name'].startswith('mihomo-linux-amd64') and a['name'].endswith('.gz') and 'compatible' in a['name']))")
          echo "mihomo asset: $url"
          curl -fsSL "$url" -o mihomo.gz
          gunzip -f mihomo.gz
          mkdir -p bin
          mv mihomo bin/mihomo
          chmod +x bin/mihomo
          ./bin/mihomo -v

      - name: Generate subscription
        env:
          PYTHONIOENCODING: utf-8
        run: python region_group.py --no-color

      # 把订阅写入 Cloudflare KV。未配置 Secrets 时脚本会跳过(不报错)。
      - name: Publish to Cloudflare KV
        env:
          PYTHONIOENCODING: utf-8
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python publish_cloudflare.py

      # 顺便把订阅提交回仓库，作为 raw/jsdelivr 备用镜像。
      - name: Commit backup mirror
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/karing_region.yaml output/karing_region_meta.json
          if git diff --cached --quiet; then
            echo "无变化, 跳过提交"
          else
            git commit -m "chore: update subscription [skip ci]"
            git push
          fi
